name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build check, test bed, demo and headless browser check
        run: npm run verify
      - name: Deeper property run
        run: NIKASHA_PROPERTY_RUNS=5000 node --test test/invariants.test.js
